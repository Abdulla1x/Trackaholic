services:
  - type: web
    # Must match the live service, which is the -us one: the original
    # macros-calculator-api was retired in the region move and now 404s.
    # NOTE: this file is NOT synced with the Render dashboard, and the
    # dashboard is the source of truth for every value here. Treat this
    # blueprint as documentation of intent, not as deployed state.
    name: macros-calculator-api-us
    runtime: python
    plan: free
    # Must stay outside the EEA/UK/CH: Gemini's free tier is geo-blocked there
    # and every analysis fails with 400 FAILED_PRECONDITION. Keep this in the
    # same region as the Neon project so DB round-trips stay local.
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts (single instance, no race).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Neon Postgres connection string, as postgresql+psycopg://...?sslmode=require
      # Set in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Gemini API key for AI meal analysis (optional; feature 503s without it).
      - key: GEMINI_API_KEY
        sync: false
      # Gemini model id for meal analysis (voice notes and the weekly review
      # have their own chains, below). Committed (not sync: false) so the intended model is
      # visible here, but editable in the dashboard to swap models without a
      # deploy when Google retires one. This file is not synced to the service:
      # the dashboard's value is the one that runs.
      - key: MEAL_AI_MODEL
        value: gemini-3.6-flash
      # Tried when the model above is overloaded (5xx) or out of quota (429);
      # comma-separated, in order. Overload is per serving pool and quotas are
      # per model, so each one listed is another day's free allowance. Set
      # empty to disable the fallback.
      - key: MEAL_AI_FALLBACK_MODEL
        value: gemini-3.8-flash,gemini-2.5-flash
      # The models a voice note tries, comma-separated, in order. Lite is last
      # because it mishears more, and the transcript is shown for editing
      # before anything is estimated. Empty uses the analysis chain above.
      - key: MEAL_AI_TRANSCRIBE_MODELS
        value: gemini-3.6-flash,gemini-3.8-flash,gemini-2.5-flash,gemini-3.5-flash-lite
      # The models the weekly review's wording tries. Lite alone: it has 500
      # free requests a day against each Flash model's 20, and a failed
      # summary loses nothing. Empty uses the analysis chain above.
      - key: MEAL_AI_REVIEW_MODELS
        value: gemini-3.5-flash-lite
      # The models a lighter-AI estimate tries: the Log panel's offer when the
      # analysis chain is out or busy. Empty keeps this default; it never falls
      # back to the analysis chain, whose shared ceiling it sits outside.
      - key: MEAL_AI_LITE_MODELS
        value: gemini-3.5-flash-lite
      # How long one analysis may keep retrying a busy provider before giving
      # up, in seconds. Raise it from the dashboard during a provider overload;
      # no deploy needed — but the frontend's own request timeout must stay
      # above it (see ANALYZE_TIMEOUT_MS in frontend/src/api/client.ts).
      - key: MEAL_AI_DEADLINE_S
        value: "60"
      # Provider attempts per user action (in-code defaults 4 / 4 / 2 for
      # analysis / voice note / review). Refused attempts count against the
      # free tier's per-day quota, so this stays low until billing is on.
      - key: MEAL_AI_MAX_ATTEMPTS
        value: ""
      # Per-user daily cap on GET /api/ai/status?probe=true, which spends one
      # real provider call. Results are cached for 60s process-wide, so this
      # only bounds a determined caller.
      - key: AI_PROBE_DAILY_LIMIT
        value: "10"
      # When non-empty, /api/ai/status?probe=true includes the provider's own
      # error text (truncated). Off by default because signup is open; turn it
      # on in the dashboard while diagnosing, then off again.
      - key: MEAL_AI_STATUS_DETAIL
        value: ""
      # Per-user daily cap on AI analyses, protecting the shared Gemini quota.
      - key: AI_DAILY_LIMIT
        value: "12"
      # Voice notes get their own allowance so speaking a meal doesn't cost
      # twice what typing it does.
      - key: AI_TRANSCRIBE_DAILY_LIMIT
        value: "16"
      # Plain-English readings of the weekly review get their own allowance for
      # the same reason: one costs about a tenth of an analysis, and a week's
      # worth of readings should not eat the allowance for logging meals.
      - key: AI_REVIEW_DAILY_LIMIT
        value: "3"
      # Ceiling across all users and every call kind -- analyses, voice notes,
      # status probes and review summaries alike; lighter-AI estimates have
      # their own ceiling below. The per-user caps bound one
      # account; this bounds the app, so mass signups can't drain the free
      # quota or, on a paid key, the money. Gemini's free tier is 20 requests a
      # day PER MODEL, failed attempts included: keep this well under 20 x the
      # models in the chain. Read the real limits at aistudio.google.com/rate-limit.
      - key: AI_GLOBAL_DAILY_LIMIT
        value: "40"
      # Lighter-AI estimates per day across all users, outside the 40 above:
      # the offer appears when the main AI is out, and the 40 is usually spent
      # by then too. Flash-Lite's 500 free requests a day are shared with the
      # voice backup, the review and refused retries. 0 turns it off.
      - key: AI_LITE_DAILY_LIMIT
        value: "200"
      # Demo accounts (POST /api/demo) the whole app may start per UTC day. Each
      # is a temporary account with a month of made-up data, deleted after a
      # day, and none of them can call the AI. 0 turns the demo off.
      - key: DEMO_DAILY_LIMIT
        value: "40"
      # Resend API key for password-reset email, sending access only. Set in
      # the dashboard; the feature 503s without it (uniformly, for known and
      # unknown addresses).
      - key: RESEND_API_KEY
        sync: false
      # The "From" address, on the domain verified in Resend
      # (noreply@trackaholic.app). Set in the dashboard alongside the key.
      - key: EMAIL_SENDER_ADDRESS
        sync: false
      # Display name beside that address.
      - key: EMAIL_SENDER_NAME
        value: Trackaholic
      # Frontend origin used to build the emailed reset link. Committed on
      # purpose — deriving it from the request's Host header instead would be
      # host-header injection, which poisons the link in the victim's mailbox.
      - key: APP_BASE_URL
        value: https://trackaholic.app
      # Reset link lifetime in minutes. Raise it from the dashboard if delivery
      # proves slow; an unauthenticated sender is often greylisted for several
      # minutes before the mail is even readable.
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      # Ceiling on reset emails per day across all users. The per-IP limit
      # bounds one caller; this bounds the app, so the provider's free 300/day
      # can't be drained out from under genuine requests.
      - key: PASSWORD_RESET_GLOBAL_DAILY_LIMIT
        value: "100"
      # Site-wide outage/maintenance notice. Committed empty and read on every
      # request, so an incident can be announced by editing it in the dashboard
      # with no deploy; blank it again to clear the banner. Release notes are
      # committed in app/announcements.py — this is only for live status.
      - key: STATUS_BANNER
        value: ""
      # Your deployed frontend origin(s), comma-separated. Set in the Render
      # dashboard — a committed placeholder would silently block the real
      # frontend if left unedited.
      - key: CORS_ORIGINS
        sync: false
      # Sign in with Google: the OAuth client ID tokens must be issued to.
      # Defaults in code to the production client (public, not a secret);
      # set only to point at a client in another Google Cloud project.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Who may read /api/admin. sync: false because it is an access-control
      # list — committing addresses here would publish them and, worse, make
      # the repo the place people edit privileges. Unset means nobody is an
      # admin, which is what makes leaving it out of this file safe.
      - key: ADMIN_EMAILS
        sync: false
      - key: PYTHON_VERSION
        value: "3.14.4"
